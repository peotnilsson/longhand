<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    The Longhand mark on its own tile: an H standing inside an L, the same
    geometry as src/Mark.tsx drawn on a 32 grid. Every stroke lands on whole
    pixels at 16px, and the H is wide enough that its counter stays open there
    — without that the three verticals read as a single letter. The tile keeps
    the contrast against a browser's chrome, light or dark.
  -->
  <rect width="32" height="32" rx="7" fill="#1a1a18" />
  <g
    fill="none"
    stroke="#f6f4f0"
    stroke-width="4"
    stroke-linecap="square"
    stroke-linejoin="miter"
  >
    <path d="M6 6V24H26" />
    <path d="M14 12V24" />
    <path d="M22 12V24" />
    <path d="M14 18H22" />
  </g>
</svg>
