name: CI

# Two jobs on purpose.
#
# `check` is the gate: lint, the unit tests (which include the whole
# verification suite) and the production build. If any of those fail, the
# commit is broken and the red mark means something.
#
# `browser` drives a real Chromium through the app. It is the most valuable
# pass and the least portable one — it uses the File System Access API, the
# origin-private file system, clipboard permissions and print pagination, all
# of which behave differently on a runner than on a laptop. Until it has run
# green for a while it does not block a push: a flaky browser on someone
# else's machine must not stop work landing.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests and the verification suite
        run: npm test

      - name: Build
        run: npm run build

  browser:
    name: Browser pass (not blocking yet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Playwright is not a dependency of the app — it is only needed here — so
      # it is installed without touching package.json, exactly as the README
      # says to do it locally. The full Chromium, not the headless shell: the
      # shell is missing the file-system pieces this pass exercises.
      - name: Install Playwright and Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: Serve the build and run the browser checks
        run: |
          npx vite preview --port 4173 &
          npx --yes wait-on --timeout 60000 http://localhost:4173/
          npm run verify

      - name: Keep the screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-screenshots
          path: verify-*.png
          if-no-files-found: ignore
          retention-days: 7
